<!-- @dsCard group="Widgets" height=380 subtitle="The statue, the board's one light" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title><link rel="stylesheet" href="../../widgets.css">
</head>
<body>
<div class="fg-tile fg-hero fg-cat-gold" style="max-width:640px">
  <div class="fg-label" style="margin:0">The statue</div>
  <div style="font:800 44px/44px var(--fg-display);letter-spacing:-0.02em;color:var(--gold,#d4af37);margin-top:14px">44.2</div>
  <div style="font:700 22px/28px var(--fg-display);margin-top:4px">III Forged</div>
  <div class="fg-sub" style="margin-top:2px">Next tier at 60</div>
  <div style="display:grid;gap:8px;margin-top:22px;max-width:46%">
    <div class="fg-cat-business"><div class="fg-sub" style="display:flex;justify-content:space-between">Business<span style="font-family:var(--fg-mono);color:var(--ct)">47</span></div><div style="height:3px;background:var(--raised,#1d1e29);border-radius:3px;margin-top:4px"><div style="width:47%;height:100%;background:var(--c);border-radius:3px"></div></div></div>
    <div class="fg-cat-school"><div class="fg-sub" style="display:flex;justify-content:space-between">School<span style="font-family:var(--fg-mono);color:var(--ct)">38</span></div><div style="height:3px;background:var(--raised,#1d1e29);border-radius:3px;margin-top:4px"><div style="width:38%;height:100%;background:var(--c);border-radius:3px"></div></div></div>
    <div class="fg-cat-athletics"><div class="fg-sub" style="display:flex;justify-content:space-between">Athletics<span style="font-family:var(--fg-mono);color:var(--ct)">55</span></div><div style="height:3px;background:var(--raised,#1d1e29);border-radius:3px;margin-top:4px"><div style="width:55%;height:100%;background:var(--c);border-radius:3px"></div></div></div>
    <div class="fg-cat-mind"><div class="fg-sub" style="display:flex;justify-content:space-between">Mind<span style="font-family:var(--fg-mono);color:var(--ct)">44</span></div><div style="height:3px;background:var(--raised,#1d1e29);border-radius:3px;margin-top:4px"><div style="width:44%;height:100%;background:var(--c);border-radius:3px"></div></div></div>
    <div class="fg-cat-nutrition"><div class="fg-sub" style="display:flex;justify-content:space-between">Nutrition<span style="font-family:var(--fg-mono);color:var(--ct)">36</span></div><div style="height:3px;background:var(--raised,#1d1e29);border-radius:3px;margin-top:4px"><div style="width:36%;height:100%;background:var(--c);border-radius:3px"></div></div></div>
  </div>
  <div class="fg-statue" aria-hidden="true">
    <img src="../../../redesign/mockup/assets/statue-base.webp" alt="">
    <img src="../../../redesign/mockup/assets/statue-veins.webp" alt="" style="-webkit-mask-image:radial-gradient(ellipse 52% 64% at 47% 30%,#000 49%,transparent 58%);mask-image:radial-gradient(ellipse 52% 64% at 47% 30%,#000 49%,transparent 58%);filter:brightness(1.3)">
    <img class="fg-b" src="../../../redesign/mockup/assets/statue-bloom.png" alt="" style="-webkit-mask-image:radial-gradient(ellipse 52% 64% at 47% 30%,#000 49%,transparent 58%);mask-image:radial-gradient(ellipse 52% 64% at 47% 30%,#000 49%,transparent 58%)">
  </div>
</div>
</body>
</html>
