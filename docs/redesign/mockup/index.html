<title>FORGE Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* FORGE board, sharp-widget system.
   Depth: a live circuit field behind translucent tiles; each tile is lit from above, casts a soft shadow,
   and catches the pointer on its edge. The statue is still the only thing that glows by itself. */
:root {
  color-scheme: dark;
  --ground: #0b0b13; --surface: #15151e; --raised: #1d1e29; --sunk: #101018;
  --tile: rgba(21, 21, 30, 0.8);
  --border: rgba(255, 255, 255, 0.06); --border-strong: rgba(255, 255, 255, 0.12);
  --ink: #f3f3f7; --ink-muted: #9497a8; --ink-label: #7f8294; --on-cat: #0b0b13;
  --gold: #d4af37; --gold-hi: #f6d77e; --gold-tint: rgba(212, 175, 55, 0.16);
  --business: #c8850e; --business-text: #e8a33d; --business-tint: rgba(232, 163, 61, 0.16);
  --school: #4676f2; --school-text: #6b97ff; --school-tint: rgba(107, 151, 255, 0.16);
  --athletics: #e3464b; --athletics-text: #f25f66; --athletics-tint: rgba(242, 95, 102, 0.16);
  --mind: #a966e5; --mind-text: #b88aff; --mind-tint: rgba(184, 138, 255, 0.16);
  --nutrition: #00a75d; --nutrition-text: #2fc779; --nutrition-tint: rgba(47, 199, 121, 0.16);
  --r0: #263247; --r1: #385573; --r2: #44698f; --r3: #5b90c7; --r4: #79b0e8; --r5: #afd5fe;
  --display: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius: 12px;
  --gap: 12px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --shadow-tile: inset 0 1px 0 rgba(255, 255, 255, 0.06), inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 1px 0 rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.3), 0 22px 44px -22px rgba(0, 0, 0, 0.85);
  --shadow-lift: inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 1px 0 rgba(0, 0, 0, 0.55), 0 6px 14px rgba(0, 0, 0, 0.35), 0 30px 60px -24px rgba(0, 0, 0, 0.9);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--ground); }
body { margin: 0; min-height: 100dvh; color: var(--ink); background: transparent; font: 500 13px/18px var(--display); -webkit-font-smoothing: antialiased; touch-action: manipulation; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); }

/* ---------- the field: a circuit board that breathes ---------- */
#field { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: -2; display: block; pointer-events: none; }
.vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(120% 80% at 50% 0%, transparent 40%, rgba(5, 5, 10, 0.55) 100%); }

/* ---------- category trio on any element ---------- */
.c-business { --c: var(--business); --ct: var(--business-text); --tint: var(--business-tint); }
.c-school { --c: var(--school); --ct: var(--school-text); --tint: var(--school-tint); }
.c-athletics { --c: var(--athletics); --ct: var(--athletics-text); --tint: var(--athletics-tint); }
.c-mind { --c: var(--mind); --ct: var(--mind-text); --tint: var(--mind-tint); }
.c-nutrition { --c: var(--nutrition); --ct: var(--nutrition-text); --tint: var(--nutrition-tint); }
.c-gold { --c: var(--gold); --ct: var(--gold); --tint: var(--gold-tint); }

/* ---------- shell ---------- */
.wrap { max-width: 1480px; margin: 0 auto; padding: 22px max(24px, env(safe-area-inset-right, 0px)) 120px max(24px, env(safe-area-inset-left, 0px)); }
.hdr { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 20px; }
.brand { text-decoration: none; display: flex; align-items: center; gap: 10px; font: 800 14px/1 var(--display); letter-spacing: 0.22em; }
.brand svg { width: 26px; height: 26px; }
.clock { display: flex; align-items: baseline; gap: 14px; margin-left: 8px; }
.clock b { font: 800 44px/1 var(--display); letter-spacing: -0.03em; }
.clock span { color: var(--ink-muted); font-weight: 600; }
.hdr .grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--tile); border: 1px solid var(--border); box-shadow: var(--shadow-tile); font-weight: 600; font-size: 12px; color: var(--ink-muted); }
.pill .d { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--gold)); }
.pill b { font: 600 12px/1 var(--mono); color: var(--ink); }
.pill.btn { color: var(--ink); }
.pill.btn:hover { border-color: var(--border-strong); }
.pill kbd { font: 600 11px/1 var(--mono); color: var(--ink-label); }

.board { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
.sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin: 18px 0 0; }
.sec h2 { margin: 0; font: 700 10.5px/14px var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-label); white-space: nowrap; }
.sec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-strong), var(--border) 40%, transparent); order: 2; }
.sec .meta { order: 3; font: 500 11px/14px var(--mono); color: var(--ink-label); }
.sec .tools { order: 4; display: flex; gap: 6px; }

/* ---------- tile: lit from above, shadow below, pointer on the edge ---------- */
.tile {
  position: relative; isolation: isolate; overflow: hidden; min-width: 0;
  border-radius: var(--radius); border: 1px solid var(--border); padding: 16px;
  background:
    radial-gradient(420px circle at var(--mx, -999px) var(--my, -999px), rgba(255, 255, 255, 0.045), transparent 45%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0) 42%),
    var(--tile);
  box-shadow: var(--shadow-tile);
  transition: transform 220ms var(--ease), box-shadow 220ms var(--ease), border-color 160ms;
}
@media (hover: hover) and (min-width: 1024px) {
  .tile, .pill, .dock { -webkit-backdrop-filter: blur(16px) saturate(1.25); backdrop-filter: blur(16px) saturate(1.25); }
}
.tile::after { /* the edge catches the pointer */
  content: ""; position: absolute; inset: 0; z-index: 3; border-radius: inherit; padding: 1px; pointer-events: none;
  background: radial-gradient(260px circle at var(--mx, -999px) var(--my, -999px), rgba(255, 255, 255, 0.28), transparent 62%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.tile.glow::before { /* the category's light in the top right corner */
  content: ""; position: absolute; z-index: -1; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(closest-side, var(--c), transparent); opacity: 0.22; transition: opacity 200ms;
}
a.tile, button.tile { display: block; text-align: left; text-decoration: none; color: inherit; cursor: pointer; }
a.tile:hover, button.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); border-color: var(--border-strong); }
a.tile:hover::before, button.tile:hover::before { opacity: 0.34; }
a.tile:active, button.tile:active { transform: translateY(0) scale(0.99); }
.tile.flare::before { animation: flare 1200ms var(--ease); }
@keyframes flare { 0% { opacity: 0.22; } 20% { opacity: 0.85; transform: scale(1.6); } 100% { opacity: 0.22; transform: scale(1); } }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, 0.05); }
.bar b { display: block; height: 100%; width: var(--p, 0%); background: var(--c); border-radius: 0 3px 3px 0; box-shadow: 0 0 10px var(--c); transition: width 600ms var(--ease); }
.lbl { font: 700 10.5px/14px var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-label); }
.thead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.thead .meta { font: 500 11px/14px var(--mono); color: var(--ink-label); }
.icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--tint); color: var(--ct); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); flex: none; }
.icon svg, .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.title { margin: 12px 0 2px; font: 700 15px/20px var(--display); letter-spacing: -0.005em; }
.sub { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.status { display: flex; align-items: center; gap: 6px; margin-top: 8px; font: 600 12px/16px var(--display); color: var(--ct); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.status.quiet { color: var(--ink-muted); }
.corner { position: absolute; top: 16px; right: 16px; font: 600 18px/22px var(--mono); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 0 9px; border-radius: 999px; background: var(--tint, var(--raised)); color: var(--ct, var(--ink-muted)); font: 600 11px/14px var(--display); white-space: nowrap; }
.chip.n { background: var(--raised); color: var(--ink-muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 8px; font: 700 12px/16px var(--display); white-space: nowrap; }
.btn.primary { background: var(--c, var(--ink)); color: var(--on-cat); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { background: var(--raised); border: 1px solid var(--border); }
.btn.ghost:hover { border-color: var(--border-strong); }
.btn.quiet { color: var(--ink-muted); }
.btn.quiet:hover { color: var(--ink); }
.btn:active { transform: scale(0.97); }
.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 9px; background: var(--sunk); border: 1px solid var(--border); }
.seg button { min-height: 28px; padding: 0 11px; border-radius: 6px; font: 600 12px/16px var(--display); color: var(--ink-muted); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
input.field, textarea.field, select.field { width: 100%; min-height: 38px; border-radius: 8px; border: 1px solid var(--border); background: var(--sunk); padding: 8px 10px; }
input.field:focus, textarea.field:focus, select.field:focus { border-color: var(--border-strong); outline: none; box-shadow: 0 0 0 2px rgba(243, 243, 247, 0.5); }
input.field::placeholder, textarea.field::placeholder { color: var(--ink-label); }

/* ---------- hero: the statue ---------- */
.hero { grid-column: span 5; grid-row: span 2; align-self: stretch; min-height: 560px; padding: 18px;
  background:
    radial-gradient(420px circle at var(--mx, -999px) var(--my, -999px), rgba(255, 255, 255, 0.04), transparent 45%),
    radial-gradient(120% 80% at 0% 100%, rgba(212, 175, 55, calc(0.1 + var(--aura, 0.5) * 0.22)), transparent 60%),
    linear-gradient(160deg, rgba(29, 30, 41, 0.92), rgba(21, 21, 30, 0.82) 55%); }
.hero .left { position: relative; z-index: 2; width: 46%; display: flex; flex-direction: column; height: 100%; min-height: 522px; }
.score { font: 800 64px/0.95 var(--display); letter-spacing: -0.04em; color: var(--gold); margin-top: 14px; text-shadow: 0 0 40px rgba(212, 175, 55, 0.25); }
.tiername { font: 700 22px/28px var(--display); margin-top: 6px; }
.cats { display: grid; gap: 4px; margin-top: auto; }
.catrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; padding: 8px 10px 9px; border-radius: 9px; transition: background 160ms; }
.catrow:hover, .catrow.on { background: rgba(255, 255, 255, 0.04); }
.catrow span { font-weight: 600; color: var(--ink-muted); font-size: 12px; }
.catrow b { font: 600 13px/16px var(--mono); color: var(--ct); }
.catrow i { grid-column: 1 / -1; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.06); overflow: hidden; display: block; }
.catrow i em { display: block; height: 100%; width: var(--p); background: var(--c); border-radius: 3px; transition: width 600ms var(--ease); }
.stage { position: absolute; right: 0; top: 0; bottom: 0; width: 60%; z-index: 1; }
.stage .halo { position: absolute; left: 4%; right: -10%; top: 2%; bottom: 0; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(212, 175, 55, calc(var(--aura) * 0.32)), rgba(212, 175, 55, calc(var(--aura) * 0.06)) 55%, transparent 100%);
  animation: breathe 7s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.7; transform: scale(0.97); } }
.halftone { position: absolute; inset: -4% -10% 0 -6%; opacity: calc(0.05 + var(--aura) * 0.12);
  background-image: radial-gradient(circle, var(--gold) 1.1px, transparent 1.6px); background-size: 9px 9px;
  -webkit-mask-image: radial-gradient(closest-side, #000 15%, transparent 78%); mask-image: radial-gradient(closest-side, #000 15%, transparent 78%); }
.rays { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; overflow: visible; }
.statue { position: absolute; bottom: 0; left: 50%; height: 96%; aspect-ratio: 805 / 1200; transform: translateX(-50%);
  /* the render has its own dark room; feather its edges into the tile */
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent), linear-gradient(180deg, transparent, #000 10%);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent), linear-gradient(180deg, transparent, #000 10%); mask-composite: intersect; }
.statue .px { position: absolute; inset: 0; transition: transform 600ms var(--ease); }
.statue img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
@property --reach { syntax: "<percentage>"; inherits: true; initial-value: 0%; }
.veinwrap { position: absolute; inset: 0; transition: --reach 1600ms var(--ease); filter: brightness(1.35) saturate(1.15);
  -webkit-mask-image: radial-gradient(ellipse 52% 64% at 47% 30%, #000 calc(var(--reach) - 9%), transparent var(--reach));
  mask-image: radial-gradient(ellipse 52% 64% at 47% 30%, #000 calc(var(--reach) - 9%), transparent var(--reach)); }
.vein { transition: opacity 400ms var(--ease); }
.bloom { opacity: calc(0.2 + var(--aura) * 0.45); mix-blend-mode: screen; }
.hero.hl .vein { opacity: 0.22 !important; }
.hero.hl .vein.on { opacity: 1 !important; }
.surge { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.surge img { position: absolute; inset: 0; width: 100%; height: 100%; }
.surge .b { mix-blend-mode: screen; }
.caption { position: absolute; z-index: 5; font: italic 800 18px/1 var(--display); padding: 7px 12px 8px; background: var(--ink); color: var(--ground); transform: skewX(-8deg); border-radius: 3px; box-shadow: 4px 4px 0 var(--c); pointer-events: none; white-space: nowrap; }
.next { margin-top: 2px; color: var(--ink-muted); font-size: 12px; }
.next b { font-family: var(--mono); color: var(--ink); font-weight: 600; }

/* ---------- power-up overlay ---------- */
#fx { position: fixed; inset: 0; width: 100vw; height: 100dvh; z-index: 40; pointer-events: none; overflow: visible; }
.bead { position: fixed; left: 0; top: 0; z-index: 41; width: 44px; height: 6px; border-radius: 6px; pointer-events: none; offset-rotate: auto; offset-anchor: 100% 50%;
  background: linear-gradient(90deg, transparent, var(--c) 55%, #fff); filter: drop-shadow(0 0 8px var(--c)) drop-shadow(0 0 2px #fff); }

/* ---------- today ---------- */
.today { grid-column: span 4; grid-row: span 2; align-self: stretch; min-height: 560px; display: flex; flex-direction: column; }
.progress { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.06); overflow: hidden; margin: -4px 0 14px; }
.progress b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--r3), var(--r5)); border-radius: 3px; transition: width 500ms var(--ease); box-shadow: 0 0 10px var(--r4); }
.group { margin: 14px 0 6px; }
.group:first-child { margin-top: 0; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 6px; min-height: 48px; padding: 2px 10px 2px 2px; border-radius: 9px; background: var(--sunk); border: 1px solid rgba(255, 255, 255, 0.03); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4); position: relative; transition: background 160ms; }
.row:hover, .row:focus-within { background: #13131c; }
.check { width: 44px; height: 44px; margin: -2px; display: grid; place-items: center; }
.check span { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--c); display: grid; place-items: center; transition: background 180ms, transform 140ms, box-shadow 180ms; }
.check:hover span { box-shadow: inset 0 0 0 2px var(--c), 0 0 12px var(--c); }
.check:active span { transform: scale(0.86); }
.row.done .check span { background: var(--c); box-shadow: 0 0 12px var(--c); }
.row.done .check span::after { content: ""; width: 9px; height: 5px; border: solid var(--on-cat); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
.rt { min-width: 0; padding: 6px 0; }
.rt .t1 { font: 700 13px/17px var(--display); overflow-wrap: anywhere; }
.rt .t2 { font-size: 11.5px; line-height: 15px; color: var(--ink-muted); min-width: 0; }
.rt .t2 em { font-style: normal; color: var(--ct); font-weight: 600; white-space: nowrap; margin-right: 6px; }
.row.done .rt .t1 { color: var(--ink-muted); }
.rside { display: flex; align-items: center; gap: 6px; }
.rside .m { font: 500 11px/1 var(--mono); color: var(--ink-label); }
.tier { padding: 2px 8px; border-radius: 999px; background: var(--raised); color: var(--ink-muted); font: 600 10.5px/14px var(--display); }
.tier.stretch { color: var(--gold); background: var(--gold-tint); }
.pencil { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-label); opacity: 0; transition: opacity 140ms; }
.row:hover .pencil, .row:focus-within .pencil { opacity: 1; }
.pencil:hover { color: var(--ink); background: var(--raised); }
.pencil svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.prog { grid-column: 2 / -1; display: flex; align-items: center; gap: 10px; padding: 0 0 8px; }
.prog input[type=range] { flex: 1; height: 22px; background: transparent; -webkit-appearance: none; appearance: none; --p: 0%; }
.prog input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--c) var(--p), rgba(255, 255, 255, 0.08) var(--p)); }
.prog input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--c) var(--p), rgba(255, 255, 255, 0.08) var(--p)); }
.prog input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--c); }
.prog input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--c); }
.prog output { font: 500 11px/1 var(--mono); color: var(--ink-muted); min-width: 108px; text-align: right; }
.adder { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; margin-top: auto; padding-top: 14px; }
.adder select.field { width: auto; }
.empty { display: grid; place-items: center; text-align: center; gap: 8px; padding: 28px 16px; border-radius: 10px; border: 1px dashed rgba(255, 255, 255, 0.1); color: var(--ink-muted); background: rgba(16, 16, 24, 0.5); }
.empty b { color: var(--ink); font-weight: 700; font-size: 14px; }
.empty .ico { width: 22px; height: 22px; color: var(--ink-label); }
.editor { grid-column: 1 / -1; display: grid; gap: 10px; padding: 12px; margin: 2px 0 8px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border-strong); }
.editor label { display: grid; gap: 4px; font-size: 11.5px; color: var(--ink-muted); font-weight: 600; }
.editor .tiers { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 8px; align-items: end; }
.editor .days { display: flex; gap: 4px; flex-wrap: wrap; }
.editor .days button { width: 34px; height: 34px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--border); font: 700 11px/1 var(--display); color: var(--ink-muted); }
.editor .days button[aria-pressed="true"] { background: var(--tint); color: var(--ct); border-color: transparent; }
.editor .acts { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
.editor .acts div { display: flex; gap: 8px; }

/* ---------- right column ---------- */
.rcol { grid-column: span 3; grid-row: span 2; display: grid; gap: var(--gap); align-content: start; }
.ringtile { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.ring { --size: 84px; width: var(--size); height: var(--size); border-radius: 50%; display: grid; place-items: center; position: relative;
  background: conic-gradient(from -90deg, var(--r3), var(--r5) calc(var(--p, 0) * 1%), rgba(255, 255, 255, 0.06) 0); box-shadow: 0 0 24px rgba(121, 176, 232, calc(var(--p) * 0.004)); }
