<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FORGE Room</title>
  <meta name="description" content="Static prototype of the FORGE v3 room: one pixel-art diorama of Jaxon's college room. Sample state, not live data.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ui/ui.css">
</head>
<body>
  <main id="room-stage" aria-label="Jaxon's room">
    <canvas id="room-canvas" role="img" aria-label="Pixel-art room at sunset. Use the object buttons, keys 1 to 7, the arrow keys, or the zone dots to look around."></canvas>
    <div id="room-hotspots"></div>
  </main>
  <nav id="zone-dots" aria-label="Zones"></nav>
  <div id="room-live" class="sr-only" aria-live="polite"></div>
  <!-- 100svh probe: phones pick the scale from the small viewport height (no jump when the toolbar hides). -->
  <div id="svh-probe" aria-hidden="true"></div>

  <script src="data.js"></script>
  <!-- Art: art-v3.js (960x540 core) if it has been built, else art.js, else the engine's test fixture.
       Each fallback is written synchronously so every later script sees window.ROOM_ART. -->
  <script>window.ROOM_ART_V3_MISSING = false;</script>
  <script src="art-v3.js" onerror="window.ROOM_ART_V3_MISSING = true"></script>
  <script>
    if (window.ROOM_ART_V3_MISSING || !window.ROOM_ART)
      document.write('<script src="art.js" onerror="window.ROOM_ART_MISSING = true"><\/script>' +
        '<script>if (window.ROOM_ART_MISSING || !window.ROOM_ART) document.write(\'<script src="test-fixture-art.js"><\\/script>\');<\/script>');
  </script>
  <script src="engine/core.js"></script>
  <script src="engine/camera.js"></script>
  <script src="engine/decode.js"></script>
  <script src="engine/light.js"></script>
  <script src="engine/gl.js"></script>
  <script src="engine/weather.js"></script>
  <script src="engine/render.js"></script>
  <script src="engine/overlay.js"></script>
  <script src="engine/input.js"></script>
  <script src="engine/fx.js"></script>
  <script src="engine/glow.js"></script>
  <script src="ui/sound.js"></script>
  <script src="ui/strip.js"></script>
  <script src="ui/today.js"></script>
  <script src="ui/panel.js"></script>
  <script src="ui/drawer.js"></script>
  <script src="ui/help.js"></script>
  <script src="ui/relics.js"></script>
  <script src="engine/main.js"></script>
</body>
</html>
