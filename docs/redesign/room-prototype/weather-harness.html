<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Harness</title>
  <style>
    :root { --bg: #141517; --fg: #f4e6c4; --dim: #9a8f86; --line: #2c2a2e; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; color: var(--dim); }
    .bar label { display: flex; gap: 6px; align-items: center; }
    .grid { display: flex; flex-wrap: wrap; gap: 12px; }
    figure { margin: 0; border: 1px solid var(--line); padding: 6px; }
    figcaption { color: var(--dim); margin-top: 4px; }
    canvas { display: block; image-rendering: pixelated; max-width: 100%; }
    #perf { color: var(--fg); }
  </style>
</head>
<body>
  <h1>FORGE weather harness</h1>
  <div class="bar">
    <label><input type="checkbox" id="play" checked> play</label>
    <label>scale <select id="scale"><option>2</option><option selected>3</option><option>4</option></select></label>
    <label>wind <input type="range" id="wind" min="0" max="60" value="12"> <span id="windv">12</span> mph</label>
    <span id="perf"></span>
  </div>
  <div class="grid" id="grid"></div>

  <script src="data.js"></script>
  <script src="art-v3.js"></script>
  <script src="engine/core.js"></script>
  <script src="engine/decode.js"></script>
  <script>
    // Emulate the r6 palette (64 colours) until the bundle ships it: append TEXTURE_SPEC section 3 entries.
    (function () {
      var add = [
        ['OAK_VD', '#2E1A12'], ['OAK_3', '#C0864A'], ['PLASTER_1', '#2A1B26'], ['PLASTER_2', '#43303B'],
        ['PLASTER_3', '#553C49'], ['PLASTER_4', '#6B4C58'], ['INK_2', '#221E24'], ['PLUM_0', '#4A2E3A'],
        ['PLUM_4', '#F0B8C6'], ['TERRA_VD', '#3F1312'], ['SLATE_D', '#2A3638'], ['SLATE_3', '#C4DADB'],
        ['COOL_0', '#1E2632'], ['COOL_1', '#2B3646'], ['COOL_2', '#3D4A60'], ['PAPER', '#D9C9A6'],
        ['PAPER_DK', '#A8987A'], ['LEAF_4', '#B7CE74'], ['GOLD_MID', '#A47A30'], ['GOLD_HI', '#F2D27A'],
        ['RAIN_0', '#5D7FA6'], ['RAIN_1', '#8FA9C9'], ['RAIN_HI', '#C9DAEE'], ['GLASS_DK', '#1A2228'],
        ['LINEN_1', '#BFAE95'], ['LINEN_2', '#8C7C6C'], ['HAZE', '#4A3F4C'],
      ];
      var cols = ROOM.art.palette.colors;
      if (cols.length === 37) add.forEach(function (c) {
        ROOM.C[c[0]] = cols.length;
        ROOM.colorNames[cols.length] = c[0];
        cols.push(c);
      });
    })();
  </script>
  <script src="engine/weather.js"></script>
  <script>
    (function () {
      'use strict';
      var D = ROOM.decode, C = ROOM.C, W = ROOM.weather;
      var params = new URLSearchParams(location.search);
      var PICK = /^(shell\.sky|shell\.outside|window\.clouds|shell\.window)/;
      var MAT_GLASS = 17, MAT_SKY = 30, MAT_WOOD = 4, MAT_WET = 29, MAT_WALL = 1;

      var RGB = ROOM.art.palette.colors.map(function (c) {
        var h = c[1];
        return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
      });

      function items() {
        var list = ROOM.art.items.filter(function (it) {
          var v = it.view || 'main';
          return (v === 'main' || v === 'front') && PICK.test(it.id);
        });
        list.sort(function (a, b) {
          return (a.layer | 0) - (b.layer | 0) || (b.kind === 'shell' ? 1 : 0) - (a.kind === 'shell' ? 1 : 0);
        });
        return list;
      }
      var ITEMS = items();
      // Region: the window sprite's rect plus a margin (world px).
      var win = ITEMS.filter(function (it) { return /^shell\.window/.test(it.id); })[0];
      var REG = { x0: win.x - 4, y0: win.y - 4, w: win.w + 8, h: win.h + 14 };

      function blit(f, img, dx, dy, mat, flags, clip) {
        for (var y = 0; y < img.h; y++) {
          var by = y + dy - f.y0;
          if (by < 0 || by >= f.h) continue;
          for (var x = 0; x < img.w; x++) {
            var wx = x + dx;
            if (clip && (wx < clip[0] || wx >= clip[0] + clip[2] || y + dy < clip[1] || y + dy >= clip[1] + clip[3])) continue;
            var bx = wx - f.x0;
            if (bx < 0 || bx >= f.w) continue;
            var v = img.px[y * img.w + x];
            if (v === 255) continue;
            var i = by * f.w + bx;
            f.buf[i] = v;
            f.aux[i * 3] = 0;
            f.aux[i * 3 + 1] = flags;
            f.aux[i * 3 + 2] = mat;
          }
        }
      }

      /** Composite the window items into frame f at time now, with a synthetic aux. */
      function composite(f, nightOn, reduced) {
        f.buf.fill(C.PLASTER);
        f.aux.fill(0);
        for (var i = 0; i < f.w * f.h; i++) f.aux[i * 3 + 2] = MAT_WALL;
        ITEMS.forEach(function (it) {
          var key = nightOn && it.variants.night ? 'night' : 'base';
          var img = D.get(it.variants[key]);
          if (!img) return;
          var sky = /^shell\.sky|^window\.clouds/.test(it.id);
          var glass = /^shell\.outside/.test(it.id);
          var mat = sky ? MAT_SKY : glass ? MAT_GLASS : MAT_WOOD;
          var flags = sky || glass ? 8 : 0;
          if (it.drift) {
            var t = reduced ? 0 : f.now / 1000;
            var ox = Math.floor((t * it.drift.speed) % it.drift.span);
            blit(f, img, it.x + ox, it.y, mat, flags, it.drift.clip);
            blit(f, img, it.x + ox - it.drift.span, it.y, mat, flags, it.drift.clip);
          } else blit(f, img, it.x, it.y, mat, flags);
        });
        // The sill: window-frame pixels in the 4 rows under the lowest glass pixel of each column.
        var wet = W.wet();
        for (var x = 0; x < f.w; x++) {
          var low = -1;
          for (var y = f.h - 1; y >= 0; y--) {
            var m = f.aux[(y * f.w + x) * 3 + 2];
            if (m === MAT_GLASS || m === MAT_SKY) { low = y; break; }
          }
          if (low < 0) continue;
          for (var k = 1; k <= 4 && low + k < f.h; k++) {
            var j = (low + k) * f.w + x;
            if (f.aux[j * 3 + 2] === MAT_WOOD) f.aux[j * 3 + 2] = wet ? MAT_WET : MAT_WOOD;
          }
        }
      }

      function frame(w, h, x0, y0, now) {
        return { buf: new Uint8Array(w * h), aux: new Uint8Array(w * h * 3), w: w, h: h, x0: x0, y0: y0, now: now, offs: [0, 0, 0, 0, 0, 0, 0], z: 1 };
      }

      var PANELS = [
        { label: 'clear', weather: 'clear' },
        { label: 'partly', weather: 'partly' },
        { label: 'overcast', weather: 'overcast' },
        { label: 'fog', weather: 'fog' },
        { label: 'drizzle', weather: 'drizzle' },
        { label: 'rain 2 mm/h', weather: 'rain', precip: 2 },
        { label: 'rain 10 mm/h', weather: 'rain', precip: 10 },
        { label: 'storm (flash)', weather: 'storm', flashAt: true },
        { label: 'storm', weather: 'storm' },
        { label: 'snow', weather: 'snow' },
        { label: 'night rain', weather: 'rain', precip: 4, night: true },
        { label: 'night storm (flash)', weather: 'storm', night: true, flashAt: true },
        { label: 'night fog', weather: 'fog', night: true },
        { label: 'night snow', weather: 'snow', night: true },
        { label: 'rain, reduced motion', weather: 'rain', precip: 4, reduced: true },
        { label: 'storm, reduced motion', weather: 'storm', reduced: true },
      ];
      var only = params.get('only');
      if (only) PANELS = PANELS.filter(function (p) { return only.split(',').indexOf(p.weather) >= 0 || only.split(',').indexOf(p.label) >= 0; });

      var grid = document.getElementById('grid');
      var scaleSel = document.getElementById('scale');
      if (params.get('scale')) scaleSel.value = params.get('scale');
      var windIn = document.getElementById('wind');
      if (params.get('wind')) windIn.value = params.get('wind');
      PANELS.forEach(function (p) {
        var fig = document.createElement('figure');
        var cv = document.createElement('canvas');
        cv.width = REG.w;
        cv.height = REG.h;
        var cap = document.createElement('figcaption');
        cap.textContent = p.label;
        fig.appendChild(cv);
        fig.appendChild(cap);
        grid.appendChild(fig);
        p.canvas = cv;
        p.cap = cap;
      });

      // The first flash at or after t (for the "flash" panels).
      function nextFlash(t) {
        var P = W.pure;
        var s = P.flashSequences(1, t, t + 60000)[0];
        return s + 10;
      }

      /** Render one panel's frame at time now and paint it into its canvas. */
      function drawPanel(p, now) {
        var f = frame(REG.w, REG.h, REG.x0, REG.y0, now);
        ROOM.state.night = !!p.night;
        ROOM.state.reducedMotion = !!p.reduced;
        W.setDebug({ weather: p.weather, precip: p.precip != null ? p.precip : null, wind: +windIn.value, dir: 160, drips: true });
        if (!W.pure.isRainy(p.weather)) W.state.lastRainAt = 0;
        if (p.flashAt) f.now = nextFlash(now);
        composite(f, !!p.night, !!p.reduced);
        W.draw(f);
        var k = W.flash(f.now);
        var cv = p.canvas, ctx = cv.getContext('2d');
        var img = ctx.createImageData(f.w, f.h);
        for (var i = 0; i < f.buf.length; i++) {
          var c = RGB[f.buf[i]] || [255, 0, 255];
          img.data[i * 4] = c[0];
          img.data[i * 4 + 1] = c[1];
          img.data[i * 4 + 2] = c[2];
          img.data[i * 4 + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        var s = +scaleSel.value;
        cv.style.width = f.w * s + 'px';
        cv.style.height = f.h * s + 'px';
        p.cap.textContent = p.label + (k ? '  flash ' + k.toFixed(1) : '') + '  ' + W.lastMs.toFixed(2) + ' ms';
        return f;
      }

      function renderAll(now) {
        PANELS.forEach(function (p) { drawPanel(p, now); });
      }

      /** Draw time at 556x352 (the r6 core) with the window composited in place, per state. */
      function perf(frames) {
        frames = frames || 240;
        var out = {};
        ['clear', 'overcast', 'fog', 'drizzle', 'rain', 'storm', 'snow'].forEach(function (wx) {
          ROOM.state.night = false;
          ROOM.state.reducedMotion = false;
          W.setDebug({ weather: wx, precip: wx === 'rain' ? 8 : null, wind: 20, dir: 160 });
          var f = frame(556, 352, 0, 0, 0);
          var tot = 0, worst = 0;
          var buf0 = null, aux0 = null;
          composite(f, false, true);
          buf0 = f.buf.slice();
          aux0 = f.aux.slice();
          for (var i = 0; i < frames; i++) {
            f.buf.set(buf0);
            f.aux.set(aux0);
            f.now = 1000 + i * 33;
            var t0 = performance.now();
            W.draw(f);
            var dt = performance.now() - t0;
            tot += dt;
            if (dt > worst) worst = dt;
          }
          out[wx] = { mean: +(tot / frames).toFixed(3), worst: +worst.toFixed(3) };
        });
        return out;
      }

      var t0 = performance.now();
      var fixedT = params.has('t') ? +params.get('t') : null;
      function loop() {
        var now = fixedT != null ? fixedT : 20000 + performance.now() - t0;
        renderAll(now);
        if (document.getElementById('play').checked && fixedT == null) setTimeout(function () { requestAnimationFrame(loop); }, 33);
      }
      document.getElementById('play').addEventListener('change', loop);
      scaleSel.addEventListener('change', function () { renderAll(fixedT != null ? fixedT : 20000); });
      windIn.addEventListener('input', function () {
        document.getElementById('windv').textContent = windIn.value;
      });
      window.H = { renderAll: renderAll, drawPanel: drawPanel, panels: PANELS, perf: perf, region: REG };
      if (!params.has('noperf')) setTimeout(function () {
        var r = perf(120);
        document.getElementById('perf').textContent = 'draw at 556x352: ' + Object.keys(r).map(function (k) { return k + ' ' + r[k].mean + ' ms'; }).join(', ');
      }, 50);
      loop();
    })();
  </script>
</body>
</html>
